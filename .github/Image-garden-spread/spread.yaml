# SPDX-License-Identifier: GPL-3.0-or-later
project: checkbox-store-smoke

backends:
    garden:
        type: adhoc
        allocate: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi

            # GitHub's ubuntu-latest runners provide 4 CPUs and 16GB of RAM,
            # so the guest can be given considerably more than the defaults.
            # Override from the environment to test on a smaller machine.
            export QEMU_SMP_OPTION="-smp ${GARDEN_CPUS:-4}"
            export QEMU_MEM_OPTION="-m ${GARDEN_MEM:-4096}"

            exec image-garden allocate "$SPREAD_SYSTEM"."${ARCH:=$(uname -m)}"
        discard: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi

            image-garden discard "$SPREAD_SYSTEM_ADDRESS"
        systems:
            - ubuntu-core-18:
                  username: ubuntu
                  password: ubuntu
            - ubuntu-core-20:
                  username: ubuntu
                  password: ubuntu
            - ubuntu-core-22:
                  username: ubuntu
                  password: ubuntu
            - ubuntu-core-24:
                  username: ubuntu
                  password: ubuntu
            - ubuntu-core-26:
                  username: ubuntu
                  password: ubuntu

path: /root/checkbox

exclude:
    - ".git"
    - ".image-garden/*"
    - "artifacts/*"
    # Generated by local image-garden runs; packing these sends ~1GB to every
    # test machine. Only required for local testing
    - "*.assert"
    - "*.snap"
    - "*.img"
    - "*.iso"
    - "*.lock"
    - "*.meta-data"
    - "*.qcow2"
    - "*.qcow2.log"
    - "*.run"
    - "*.serial.log"
    - "*.stderr.log"
    - "*.stdout.log"
    - "*.user-data"

prepare: |
    . /etc/environment

suites:
    tests/:
        summary: Checkbox store-snap smoke tests
