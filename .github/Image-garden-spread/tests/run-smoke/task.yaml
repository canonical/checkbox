# SPDX-License-Identifier: GPL-3.0-or-later
summary: Install the Checkbox snap from the store and run the smoke test plan
kill-timeout: 20m
# Spread buffers task output and only flushes it on error or on each
# warn-timeout tick, so keep the tick short to get progress while the plan runs.
warn-timeout: 1m
artifacts:
  - checkbox-output.txt
  - snap-debug.txt
  - submission.json
  - submission.tar.xz
execute: |
  set -euo pipefail

  # Derive the Checkbox runtime from the system under test, the same way the
  # certification tools derive it from a snap base: coreYY -> checkboxYY.
  . /etc/os-release
  CHECKBOX="checkbox$(echo "$VERSION_ID" | grep -Po '^\d{2}')"
  CHECKBOX_CHANNEL="${CHECKBOX_CHANNEL:-edge}"

  echo "Testing $CHECKBOX from $CHECKBOX_CHANNEL"

  # A checkboxXX*.snap placed at the root of the suite takes precedence over
  # the store, which is how a locally built snap gets tested.
  if ls ../../"$CHECKBOX"*.snap >/dev/null 2>&1; then
    echo "Using local Checkbox snap"
    cp ../../"$CHECKBOX"*.snap .
    cp ../../"$CHECKBOX"*.assert . 2>/dev/null || true
  else
    echo "Downloading $CHECKBOX from the store"
    snap download "$CHECKBOX" \
      --channel="$CHECKBOX_CHANNEL" --basename="$CHECKBOX"
  fi

  # snapd may still be settling a boot-time change; talking to it while it is
  # busy makes the following commands hang.
  snap wait system seed.loaded

  if snap list "$CHECKBOX" >/dev/null 2>&1; then
    snap remove --purge "$CHECKBOX"
  fi

  # Acknowledge the assertion so the snap can be installed without
  # --dangerous, then install it as a strict snap in devmode. This mirrors
  # what the certification tools run on a device under test.
  if [ -f "$CHECKBOX".assert ]; then
    snap ack "$CHECKBOX".assert
    CHANGE_ID="$(snap install --no-wait --devmode "$CHECKBOX".snap)"
  else
    CHANGE_ID="$(snap install --no-wait --dangerous --devmode "$CHECKBOX".snap)"
  fi

  # --no-wait returns a change id instead of blocking, so settle that change
  # before using the snap.
  snap watch "$CHANGE_ID"

  snap start --enable "$CHECKBOX.agent"

  {
    echo "# snap list"
    snap list "$CHECKBOX"
    echo
    echo "# snap services"
    snap services "$CHECKBOX"
    echo
    echo "# snap warnings"
    snap warnings
  } > snap-debug.txt

  # tee so the run is visible in spread's warn-timeout dumps and preserved as
  # an artifact even when the task fails.
  set +e
  "$CHECKBOX.checkbox" control 127.0.0.1 launcher.conf 2>&1 \
    | tee checkbox-output.txt
  checkbox_status=${PIPESTATUS[0]}
  set -e

  echo "Checkbox exited with $checkbox_status"
  exit "$checkbox_status"
