name: Submit a Checkbox snap test plan to the lab
description: Patch a Checkbox snap and submit its test plan to Testflinger

inputs:
  data_source:
    description: "Target image and provisioning data (ex. `url:` or `distro:`)"
    required: false
    default: ""
  queue:
    description: "Queue that will run the testing (ex. 202012-28526)"
    required: true
  test_plan:
    description: "Test plan to run (ex. com.canonical.certification::sru)"
    required: true
  match:
    description: "Subset of jobs to run (ex. .*wireless.*)"
    required: false
    default: ".*"
  launcher_override:
    description: "Launcher with additional values that take priority"
    default: ""
    required: false
  checkbox_revision:
    description: "Checkbox revision installed on the Testflinger agent as the controller"
    required: true
  checkbox_channel:
    description: "Checkbox snap channel to patch and install"
    required: true
    default: edge
  checkbox_series:
    description: "Checkbox snap series to patch (ex. 24 for checkbox24)"
    required: true
  architecture:
    description: "Target machine's snap architecture (ex. arm64)"
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt install -y -qq gettext jq squashfs-tools snapd

    - name: Download and patch the target snap
      shell: bash
      env:
        CHECKBOX_SERIES: ${{ inputs.checkbox_series }}
        CHECKBOX_CHANNEL: ${{ inputs.checkbox_channel || 'edge' }}
        CHECKBOX_ARCHITECTURE: ${{ inputs.architecture }}
      working-directory: ${{ github.action_path }}/../../..
      run: |
        set -euo pipefail
        SNAP="checkbox$CHECKBOX_SERIES"
        SNAP_PATH=tools/lab_dispatch
        # snap download uses the runner's architecture (amd64), but the lab
        # target may be arm64. Ask the store for the target architecture and
        # select the exact channel/architecture entry from its response.
        SNAP_URL=$(curl -fsSL \
          -H 'Snap-Device-Series: 16' \
          -H "Snap-Device-Architecture: $CHECKBOX_ARCHITECTURE" \
          "https://api.snapcraft.io/v2/snaps/info/$SNAP" \
          | jq -er --arg channel "$CHECKBOX_CHANNEL" \
            --arg architecture "$CHECKBOX_ARCHITECTURE" \
            '[."channel-map"[] |
              select(.channel.name == $channel and
                     .channel.architecture == $architecture) |
              .download.url] |
             if length == 1 then .[0] else error("snap channel/architecture not found") end')
        curl -fLsS --output "$SNAP_PATH/checkbox-base.snap" "$SNAP_URL"
        python3 tools/image-garden/patch_checkbox_snap.py \
          --series "$CHECKBOX_SERIES" \
          --snap-file "$SNAP_PATH/checkbox-base.snap" \
          --output-dir "$SNAP_PATH/patched-checkbox" \
          --force
        snap pack "$SNAP_PATH/patched-checkbox" "$SNAP_PATH" \
          --filename=patched-checkbox.snap

    - name: Build the test resource
      shell: bash
      env:
        INPUT_DATA_SOURCE: ${{ inputs.data_source }}
        INPUT_QUEUE: ${{ inputs.queue }}
        INPUT_MATCH: ${{ inputs.match || '.*' }}
        INPUT_TEST_PLAN: ${{ inputs.test_plan }}
        INPUT_LAUNCHER_OVERRIDE: ${{ inputs.launcher_override }}
        INPUT_CHECKBOX_REVISION: ${{ inputs.checkbox_revision }}
        INPUT_CHECKBOX_SERIES: ${{ inputs.checkbox_series }}
      working-directory: ${{ github.action_path }}/../../../tools/lab_dispatch
      run: |
        echo "::group::Building the testflinger job"
        if [ -n "$INPUT_DATA_SOURCE" ]; then
          INPUT_DATA_SOURCE="provision_data: $INPUT_DATA_SOURCE"
        fi
        envsubst \
          '$INPUT_CHECKBOX_REVISION $INPUT_CHECKBOX_SERIES $INPUT_DATA_SOURCE $INPUT_QUEUE' \
          < generic_snap.yaml | tee job.yaml
        echo "::endgroup::"

        echo "::group::Building the Checkbox launcher"
        # this goes from .template. (missing secret, testplan, match etc. to .partial.)
        # this is partial as some values are filled in on the agent (like wireless access points names)
        envsubst '$INPUT_TEST_PLAN $INPUT_MATCH' \
          < resources/checkbox.no-manifest.template.conf \
          | tee resources/checkbox.no-manifest.partial.conf
        echo "::endgroup::"

        echo "::group::Dumping launcher overrides"
        echo "$INPUT_LAUNCHER_OVERRIDE" | tee launcher_override.conf
        echo "::endgroup::"

    - name: Work around relative attachment paths
      shell: bash
      run: |
        # this allows us to dispatch the action and the attachments with relative
        # paths even when called form outside the Checkbox repo
        action_path=$(realpath "${{ github.action_path }}/../../../tools/")
        workdir_path=$(realpath tools/)
        if [ "$action_path" = "$workdir_path" ]; then
          echo "Skipping copy as the action is already running in workdir"
        else
          cp -rT "$action_path" "$workdir_path"
        fi

    - name: Submit and monitor job
      uses: canonical/testflinger/.github/actions/submit@545ed69f17a5e639a2299e325f5fb199ca9f98af
      with:
        poll: true
        job-path: tools/lab_dispatch/job.yaml
        client-id: ${{ env.TESTFLINGER_CLIENT_ID }}
        secret-key: ${{ env.TESTFLINGER_SECRET_KEY }}
