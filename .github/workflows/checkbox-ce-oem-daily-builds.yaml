name: checkbox-ce-oem daily builds
permissions:
  contents: read
  actions: read # used by gh api
on:
  schedule:
    - cron: '00 01 * * *'
  workflow_dispatch:

jobs:
  check_for_commits:
    runs-on:
      group: "Canonical self-hosted runners"
      labels:
        - self-hosted
        - linux
        - jammy
        - large
        - X64
    name: Check for commits
    outputs:
      new_commit_count: ${{ steps.commit_check.outputs.new_commit_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for commits
        id: commit_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Trigger daily builds when there are recent changes in the CE OEM provider.
          TARGET="contrib/checkbox-ce-oem"
          time_since="24 hours ago"
  
          recent_commits=$(git log --since="$time_since" --oneline -- "$TARGET")
  
          if [ -z "$recent_commits" ]; then
            echo "No commits in the last 24 hours. Checking since last successful build..."
      
            last_pass=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs" --paginate \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/checkbox-ce-oem-daily-builds.yaml" and .conclusion == "success") | .run_started_at' \
              | head -1)
      
            time_since=${last_pass:-"1970-01-01T00:00:00Z"}
            recent_commits=$(git log --since="$time_since" --oneline -- "$TARGET")
           fi
  
          if [ -n "$recent_commits" ]; then
             commit_count=$(echo "$recent_commits" | wc -l)
             echo "Recent commits in $TARGET (since $time_since):"
             echo "$recent_commits"
          else
            commit_count=0
            echo "Recent commits in $TARGET (since $time_since):"
            echo "(none)"
          fi
  
          echo "Found $commit_count commits in $TARGET since $time_since."
          echo "new_commit_count=$commit_count" >> "$GITHUB_OUTPUT"


  checkbox-ce-oem-snap-cross-build-upload-daily:
    needs: check_for_commits
    if: ${{ needs.check_for_commits.outputs.new_commit_count != '0' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/checkbox-ce-oem-daily-cross-builds.yaml
    secrets:
      SNAPCRAFT7_CREDS: ${{ secrets.SNAPCRAFT7_CREDS }}
    with:
      store_upload: true

  checkbox-ce-oem-snap-native-build-upload-daily:
    needs: check_for_commits
    if: ${{ needs.check_for_commits.outputs.new_commit_count != '0' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/checkbox-ce-oem-daily-native-builds.yaml
    secrets:
      SNAPCRAFT7_CREDS: ${{ secrets.SNAPCRAFT7_CREDS }}
    with:
      store_upload: true
