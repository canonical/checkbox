name: Checkbox edge canary (mock)

permissions:
  contents: read

on:
  push:
    branches: [github-canary-pipelines-mock]
  # zizmor: ignore[dangerous-triggers] only runs trusted code from main
  workflow_run:
    workflows: [Daily builds]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Move the beta branch if the canary passes
        type: boolean
        default: false

concurrency:
  group: checkbox-edge-canary-mock
  cancel-in-progress: false

jobs:
  prepare:
    name: Wait for the edge packages
    runs-on: ubuntu-latest
    timeout-minutes: 320
    outputs:
      version: ${{ steps.version.outputs.version }}
      run: ${{ steps.version.outputs.run }}
    steps:
      - name: Get the edge version (mock)
        id: version
        run: |
          echo "version=0.0.0-mock" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  canary:
    # Used to find the platforms that passed, keep it in sync with
    # tools/lab_dispatch/canary_results.py
    name: ${{ matrix.platform }} on ${{ matrix.queue }}
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A failing device does not fail the run, the platform passes if any of
    # its devices passed
    continue-on-error: true
    strategy:
      fail-fast: false
      # Two devices per platform, the anchors are reused by the retry jobs
      matrix:
        include:
          - platform: uc22-amd64
            track: &uc22 uc22
            provision_data: &jammy "{distro: jammy}"
            queue: &uc22-amd64-1 hp-elitebook-850-g8-notebook-pc-c28760
          - platform: uc22-amd64
            track: *uc22
            provision_data: *jammy
            queue: &uc22-amd64-2 hp-elitebook-850-g8-notebook-pc-c28761
          - platform: uc24-amd64
            track: &uc24 uc24
            provision_data: &noble "{distro: noble}"
            queue: &uc24-amd64-1 dell-precision-tower-7820-c25401
          - platform: uc24-amd64
            track: *uc24
            provision_data: *noble
            queue: &uc24-amd64-2 dell-optiplex-3000-thin-client-c29189
          - platform: uc24-arm64
            track: *uc24
            provision_data: &uc24-pi "{url: 'https://tel-image-cache.canonical.com/oem-share/hardware-certification/ubuntu-core/24/cert-ubuntu-core-24-pi-arm64.img.xz', preset: RPiUC}"
            queue: &uc24-arm64-1 rpi4
          - platform: uc24-arm64
            track: *uc24
            provision_data: *uc24-pi
            queue: &uc24-arm64-2 rpi400-arm64
    defaults: &lab-dispatch
      run:
        shell: bash
    steps: &device-steps
      - name: Run the canary (mock)
        env:
          JOB: ${{ github.job }}
          QUEUE: ${{ matrix.queue }}
        run: |
          sleep 10
          case "$JOB/$QUEUE" in
            canary/dell-optiplex-3000-thin-client-c29189|canary/rpi4|\
            canary/rpi400-arm64|retry-uc24-arm64/rpi400-arm64)
              echo "::error::Mock failure on $QUEUE"; exit 1 ;;
          esac

  check:
    name: Check if a retry is needed
    needs: [prepare, canary]
    if: ${{ !cancelled() && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      retry: ${{ steps.failed.outputs.retry }}
    steps:
      - name: Checkout checkbox monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Explain the result of each platform
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/lab_dispatch/canary_results.py check
      - name: Wait 30 minutes before retrying
        if: steps.failed.outputs.retry != '[]'
        run: sleep 30

  # One retry job per platform, so a platform that passed shows as skipped.
  # The name has no expressions, so skipped jobs show it as is, and GitHub
  # appends the queue to it: "<platform> (retry) (<queue>)"
  retry-uc22-amd64:
    name: uc22-amd64 (retry)
    needs: check
    if: ${{ !cancelled() && contains(needs.check.outputs.retry, '"uc22-amd64"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        queue: [*uc22-amd64-1, *uc22-amd64-2]
        include:
          - platform: uc22-amd64
            track: *uc22
            provision_data: *jammy
    defaults: *lab-dispatch
    steps: *device-steps

  retry-uc24-amd64:
    name: uc24-amd64 (retry)
    needs: check
    if: ${{ !cancelled() && contains(needs.check.outputs.retry, '"uc24-amd64"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        queue: [*uc24-amd64-1, *uc24-amd64-2]
        include:
          - platform: uc24-amd64
            track: *uc24
            provision_data: *noble
    defaults: *lab-dispatch
    steps: *device-steps

  retry-uc24-arm64:
    name: uc24-arm64 (retry)
    needs: check
    if: ${{ !cancelled() && contains(needs.check.outputs.retry, '"uc24-arm64"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        queue: [*uc24-arm64-1, *uc24-arm64-2]
        include:
          - platform: uc24-arm64
            track: *uc24
            provision_data: *uc24-pi
    defaults: *lab-dispatch
    steps: *device-steps

  result:
    name: Check that every platform passed
    needs: [prepare, check, retry-uc22-amd64, retry-uc24-amd64, retry-uc24-arm64]
    if: ${{ !cancelled() && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout checkbox monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Explain the result of each platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/lab_dispatch/canary_results.py result

  promote:
    name: Move the beta branch
    needs: [prepare, result]
    if: ${{ !cancelled() && needs.result.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.promote) }}
    runs-on: ubuntu-latest
    steps:
      - name: Move the beta branch to the tested version (mock)
        run: echo "Mock move of beta"
