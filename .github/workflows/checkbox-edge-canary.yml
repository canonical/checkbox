name: Checkbox edge canary (mock)

permissions:
  contents: read

on:
  push:
    branches: [github-canary-pipelines-mock]
  # zizmor: ignore[dangerous-triggers] only runs trusted code from main
  workflow_run:
    workflows: [Daily builds]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Move the beta branch if the canary passes
        type: boolean
        default: false

concurrency:
  group: checkbox-edge-canary-mock
  cancel-in-progress: false

jobs:
  prepare:
    name: Wait for the edge packages
    runs-on: ubuntu-latest
    timeout-minutes: 320
    outputs:
      version: ${{ steps.version.outputs.version }}
      run: ${{ steps.version.outputs.run }}
      devices: ${{ steps.devices.outputs.devices }}
    steps:
      - name: List the canary devices
        id: devices
        env:
          # Each platform passes if the canary passes on any of its devices
          DEVICES: |
            - platform: uc22-amd64
              track: uc22
              provision_data: "{distro: jammy}"
              queue: hp-elitebook-850-g8-notebook-pc-c28760
            - platform: uc22-amd64
              track: uc22
              provision_data: "{distro: jammy}"
              queue: hp-elitebook-850-g8-notebook-pc-c28761
            - platform: uc24-amd64
              track: uc24
              provision_data: "{distro: noble}"
              queue: dell-precision-tower-7820-c25401
            - platform: uc24-amd64
              track: uc24
              provision_data: "{distro: noble}"
              queue: dell-optiplex-3000-thin-client-c29189
            - platform: uc24-arm64
              track: uc24
              provision_data: "{url: 'https://tel-image-cache.canonical.com/oem-share/hardware-certification/ubuntu-core/24/cert-ubuntu-core-24-pi-arm64.img.xz', preset: RPiUC}"
              queue: rpi4
            - platform: uc24-arm64
              track: uc24
              provision_data: "{url: 'https://tel-image-cache.canonical.com/oem-share/hardware-certification/ubuntu-core/24/cert-ubuntu-core-24-pi-arm64.img.xz', preset: RPiUC}"
              queue: rpi400-arm64
        run: echo "devices=$(yq -o=json -I=0 . <<< "$DEVICES")" >> "$GITHUB_OUTPUT"
      - name: Get the edge version (mock)
        id: version
        run: |
          echo "version=0.0.0-mock" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  canary:
    # The platform must be the first word of the name, it is used to find
    # the platforms that passed
    name: ${{ matrix.platform }} on ${{ matrix.queue }}
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A failing device does not fail the run, the platform passes if any of
    # its devices passed
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.devices) }}
    defaults: &lab-dispatch
      run:
        shell: bash
    steps: &device-steps
      - name: Run the canary (mock)
        env:
          JOB: ${{ github.job }}
          QUEUE: ${{ matrix.queue }}
        run: |
          sleep 10
          case "$JOB/$QUEUE" in
            canary/dell-optiplex-3000-thin-client-c29189|canary/rpi4|\
            canary/rpi400-arm64|retry-uc24-arm64/rpi400-arm64)
              echo "::error::Mock failure on $QUEUE"; exit 1 ;;
          esac

  check:
    name: Check if a retry is needed
    needs: [prepare, canary]
    if: ${{ !cancelled() && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    outputs:
      retry: ${{ steps.failed.outputs.retry }}
    steps:
      - &platform-results
        name: Explain the result of each platform
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICES: ${{ needs.prepare.outputs.devices }}
          STAGE: ${{ github.job }}
        run: |
          # Jobs that passed so far, the platform is the first word of the name
          passed=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "success") | .name' \
            | jq -Rsc 'split("\n") | map(select(. != ""))')
          report=$(jq -c --argjson passed "$passed" --arg stage "$STAGE" '
            group_by(.platform) | map(.[0].platform as $platform | {
              platform: $platform,
              queues: map(.queue),
              passed: [$passed[] | select(split(" ")[0] == $platform)]
            })
            | map(. + if .passed != [] then {
                level: "notice",
                outcome: ((if $stage == "check" then "No retry needed"
                  else "Accepted" end)
                  + ", at least one job passed: " + (.passed | join(", ")))
              } elif $stage == "check" then {
                level: "warning",
                outcome: ("No job passed, retrying "
                  + (.queues | join(" and ")) + " in 30 minutes")
              } else {
                level: "error",
                outcome: "Rejected, no job passed in either attempt"
              } end)' <<< "$DEVICES")
          jq -r '.[] | "::\(.level) title=\(.platform)::\(.outcome)"' <<< "$report"
          {
            echo "| Platform | Outcome |"
            echo "| --- | --- |"
            jq -r '.[] | "| \(.platform) | \(.outcome) |"' <<< "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          # Queues to retry, grouped by platform
          retry=$(jq -c 'map(select(.passed == []) | {(.platform): .queues})
            | add // {}' <<< "$report")
          echo "retry=$retry" >> "$GITHUB_OUTPUT"
          if [ "$STAGE" = result ]; then
            if [ "$retry" != "{}" ]; then
              echo "::error::Canary rejected: no job passed on $(jq -r 'keys | join(", ")' <<< "$retry")"
              exit 1
            fi
            echo "::notice::Canary accepted: at least one job passed on each platform"
            echo "**Canary accepted: at least one job passed on each platform.**" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Wait 30 minutes before retrying
        if: steps.failed.outputs.retry != '{}'
        run: sleep 30

  # One retry job per platform, so a platform that passed shows as skipped.
  # The matrix only has the queue, so the job names are short and readable.
  retry-uc22-amd64:
    name: uc22-amd64 (retry)
    needs: [prepare, check]
    if: ${{ !cancelled() && contains(needs.check.outputs.retry, '"uc22-amd64"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        queue: ${{ fromJSON(needs.check.outputs.retry)['uc22-amd64'] }}
    defaults: *lab-dispatch
    steps: *device-steps

  retry-uc24-amd64:
    name: uc24-amd64 (retry)
    needs: [prepare, check]
    if: ${{ !cancelled() && contains(needs.check.outputs.retry, '"uc24-amd64"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        queue: ${{ fromJSON(needs.check.outputs.retry)['uc24-amd64'] }}
    defaults: *lab-dispatch
    steps: *device-steps

  retry-uc24-arm64:
    name: uc24-arm64 (retry)
    needs: [prepare, check]
    if: ${{ !cancelled() && contains(needs.check.outputs.retry, '"uc24-arm64"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        queue: ${{ fromJSON(needs.check.outputs.retry)['uc24-arm64'] }}
    defaults: *lab-dispatch
    steps: *device-steps

  result:
    name: Check that every platform passed
    needs: [prepare, check, retry-uc22-amd64, retry-uc24-amd64, retry-uc24-arm64]
    if: ${{ !cancelled() && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - *platform-results

  promote:
    name: Move the beta branch
    needs: [prepare, result]
    if: ${{ !cancelled() && needs.result.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.promote) }}
    runs-on: ubuntu-latest
    steps:
      - name: Move the beta branch to the tested version (mock)
        run: echo "Mock move of beta"
