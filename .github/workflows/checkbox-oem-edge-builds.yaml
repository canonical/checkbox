name: checkbox-oem snap edge build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - contrib/checkbox-oem/**
      - .github/workflows/checkbox-oem-edge-builds.yaml
  workflow_dispatch:

jobs:
  snap_frontend_native:
    strategy:
      fail-fast: false
      matrix:
        type: [classic, uc]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            tag: X64
          - arch: arm64
            tag: ARM64
    runs-on:
      group: "Canonical self-hosted runners"
      labels: ["self-hosted", "linux", "noble", "large", "${{ matrix.tag }}"]
    timeout-minutes: 1200
    name: Frontend ${{ matrix.type }}26 (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Copy over the common files for series 26
        run: |
          cd contrib/checkbox-oem/checkbox-oem-snap/
          sudo apt update && sudo apt install -qq -y python3-setuptools-scm
          ./prepare.sh series_${{ matrix.type }}26

      - id: snap_build
        name: Building the snaps
        uses: Wandalen/wretry.action@df981d2bb22b26b5b23754bb516d0de8c1bfbbec
        timeout-minutes: 600 # 10 h
        with:
          action: snapcore/action-build@v1.3.0
          attempt_delay: 600000 # 10 min
          attempt_limit: 5
          with: |
            path: contrib/checkbox-oem/checkbox-oem-snap/series_${{ matrix.type }}26
            snapcraft-channel: 9.x/candidate

      - name: Upload logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: snapcraft-log-series-${{ matrix.type }}26-${{ matrix.arch }}
          path: |
            /home/runner/.cache/snapcraft/log/
            /home/runner/.local/state/snapcraft/log/
            contrib/checkbox-oem/checkbox-oem-snap/series_${{ matrix.type }}26/checkbox*.txt

      - name: Upload the snaps as artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: series_${{ matrix.type }}26_${{ matrix.arch }}
          path: ${{ steps.snap_build.outputs.snap }}

      - name: Publish to edge
        uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT7_CREDS }}
        with:
          snap: ${{ steps.snap_build.outputs.snap }}
          release: ${{ matrix.type == 'uc' && 'uc26/edge' || '26.04/edge' }}
