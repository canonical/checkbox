name: Debug Snap cross-build hangs
# Temporary: checks whether running the privileged core18 build container
# (old, systemd-based image) breaks snapcraft installs on the ubuntu-22.04
# host, and whether restarting snapd or snapd.apparmor fixes it.
# Nothing is uploaded.
permissions:
  contents: read
on:
  push:
    branches: [debug-snap-cross-build-hang]
  workflow_dispatch:
jobs:
  snapcraft-install:
    strategy:
      fail-fast: false
      matrix:
        fix: [none, restart-snapd, restart-snapd-apparmor]
    runs-on: ubuntu-22.04
    name: Install snapcraft after container (fix ${{ matrix.fix }})
    env:
      FIX: ${{ matrix.fix }}
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Host AppArmor snap-confine profiles before
        run: |
          snap version
          systemctl cat snapd.apparmor.service
          sudo grep -i snap-confine /sys/kernel/security/apparmor/profiles || true

      - name: Run the core18 build container (same as snapcraft-multiarch-action)
        timeout-minutes: 45
        run: |
          docker run --rm --tty --privileged --platform linux/arm/v7 \
            --env USE_SNAPCRAFT_CHANNEL=5.x/stable \
            ghcr.io/canonical/snapcraft-container@sha256:79ff5f6bd6b914351e73155dd1331d13a774d148bd7b2adf7a00eddbe6aee1b8 snapcraft --version

      - name: Host AppArmor snap-confine profiles after
        run: |
          sudo grep -i snap-confine /sys/kernel/security/apparmor/profiles || true

      - name: Apply fix
        run: |
          case "$FIX" in
            restart-snapd-apparmor)
              sudo systemctl restart snapd.apparmor
              ;;
            restart-snapd)
              sudo systemctl restart snapd
              ;;
          esac
          systemctl status --no-pager snapd.apparmor snapd || true
          sudo grep -i snap-confine /sys/kernel/security/apparmor/profiles || true

      - name: Install snapcraft (same as canonical/action-publish)
        run: |
          sudo snap install --classic snapcraft
          snapcraft --version
