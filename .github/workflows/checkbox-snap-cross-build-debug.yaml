name: Debug Snap cross-build hangs
# Temporary: checks that refreshing snapd on ubuntu-22.04 runners lets
# canonical/action-publish install snapcraft. Nothing is uploaded.
permissions:
  contents: read
on:
  push:
    branches: [debug-snap-cross-build-hang]
  workflow_dispatch:
jobs:
  snapcraft-install:
    strategy:
      fail-fast: false
      matrix:
        refresh_snapd: [false, true]
    runs-on: ubuntu-22.04
    name: Install snapcraft (refresh snapd ${{ matrix.refresh_snapd }})
    steps:
      - name: snapd before
        run: |
          snap version
          dpkg -l snapd | tail -1
          snap list
      - name: Refresh snapd to latest/stable
        if: matrix.refresh_snapd
        run: |
          sudo snap refresh snapd --channel=latest/stable || sudo snap install snapd --channel=latest/stable
          snap version
      - name: Install snapcraft (same as canonical/action-publish)
        run: |
          sudo snap install --classic snapcraft
          snapcraft --version
