name: Re-run failed daily builds
permissions: {}
on:
  # Safe: no code is checked out, only the id of the run is used
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Daily builds]
    types: [completed]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
jobs:
  rerun:
    name: Re-run failed jobs once
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to re-run the jobs of the daily builds run
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run rerun "$RUN_ID" --failed
