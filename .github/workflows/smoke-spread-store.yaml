name: Run smoke plan via spread (store snaps)

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    paths:
      - .github/Image-garden-spread/**
      - .github/workflows/smoke-spread-store.yaml
  workflow_dispatch:
    inputs:
      channel:
        description: Store channel to install the Checkbox snaps from
        type: string
        default: edge
  workflow_call:
    inputs:
      channel:
        description: Store channel to install the Checkbox snaps from
        type: string
        default: edge
        required: false

jobs:
  smoke-spread-store:
    name: Smoke via spread on ${{ matrix.garden-system }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Set at job level so it reaches the spread run regardless of how the
    # image-garden action is invoked.
    env:
      CHECKBOX_CHANNEL: ${{ inputs.channel || 'edge' }}
    strategy:
      fail-fast: false
      matrix:
        garden-system:
          - ubuntu-core-18
          - ubuntu-core-20
          - ubuntu-core-22
          - ubuntu-core-24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The image-garden action restarts snapd and then immediately asks the
      # store about each snap it installs. It runs that query with
      # "curl --fail", so a failure is reported only as "exit code 69" with no
      # explanation. Warm the store session up front (it is kept in snapd's
      # state and survives the restart that follows) and print the real reply
      # if the query keeps failing.
      - name: Wait for snapd and warm up the store
        run: |
          snap version || true
          sudo snap wait system seed.loaded || true

          warm_up() {
            name="$1"
            for attempt in 1 2 3 4 5 6; do
              code="$(curl --silent --output /tmp/snapd-find.json \
                --write-out '%{http_code}' \
                --unix-socket /run/snapd.socket \
                "http://localhost/v2/find?name=$name" || echo 000)"
              echo "$name attempt $attempt: HTTP $code"
              if [ "$code" = 200 ]; then
                return 0
              fi
              echo "--- snapd reply for $name ---"
              head -c 2000 /tmp/snapd-find.json || true
              echo
              sleep 10
            done
            echo "::warning::store query for $name never returned 200"
          }

          for snap_name in snapd core24 image-garden; do
            warm_up "$snap_name"
          done

      # snap-install inside the image-garden action queries the store with a
      # single "curl --fail" and no retry, so one rate-limited reply aborts the
      # whole run. Retry the action the same way the snap build workflows do.
      - name: Run smoke spread suite
        uses: Wandalen/wretry.action@df981d2bb22b26b5b23754bb516d0de8c1bfbbec
        with:
          action: zyga/image-garden-action@858839da03cc989855469c388a71d91f4621deaf
          attempt_limit: 3
          attempt_delay: 60000 # 1min, to let store rate limits expire
          with: |
            image-garden-channel: latest/edge
            garden-system: ${{ matrix.garden-system }}
            spread-subdir: .github/Image-garden-spread
            spread-tasks: tests/run-smoke
            spread-artifacts: artifacts
            spread-artifacts-suffix: ${{ matrix.garden-system }}
