name: Test Launchpad monorepo import
permissions:
  contents: read
on:
  workflow_dispatch:

jobs:
  ppa_update:
    name: Sync PPA history with monorepo
    runs-on:
      group: "Canonical self-hosted runners"
      labels:
        - self-hosted
        - linux
        - jammy
        - large
        - X64
    timeout-minutes: 130
    steps:
      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -qq -y python3-launchpadlib
      - name: Checkout checkbox monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Wandalen/wretry.action@df981d2bb22b26b5b23754bb516d0de8c1bfbbec
        name: Make LP pull the monorepo
        timeout-minutes: 120
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDS }}
          PYTHONUNBUFFERED: 1
        with:
          attempt_delay: 60000 # 1 min
          attempt_limit: 60   # bounded by the step timeout
          command: |
            timeout --verbose --kill-after=10s 180s tools/release/lp_request_import.py "~checkbox-dev/checkbox/+git/checkbox"
