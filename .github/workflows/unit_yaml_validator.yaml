name: Validate unit YAML files

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/units/*.yaml'
      - '**/units/*/*.yaml'
  workflow_dispatch:

jobs:
  validate_unit_yaml:
    name: Validate unit YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Checkbox monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Install validate tool
        run: uv tool install ./unit_json_schema/validate
      - name: Validate unit YAML files
        run: |
          find . -path '*/units/**' -name "*.yaml" -print0 \
            | xargs -0 validate unit_json_schema/unit.schema.json
