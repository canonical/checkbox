[tox]
envlist = py36,py38,py310,py312,py314
skip_missing_interpreters = true
isolated_build = True

[testenv]
commands =
    {envpython} -m pip -q install ../checkbox-ng
    {envpython} -m pip install .
    {envpython} -m pip list
    {envpython} -m coverage run -m pytest checkbox_support/
    {envpython} -m coverage report
    {envpython} -m coverage xml

[testenv:py36]
deps =
    pytest
    coverage == 5.5
    pytest-cov == 3.0.0
    requests == 2.18.4
    opencv_python == 4.4.0.42
    distro == 1.0.1
    PyYAML == 3.12

[testenv:py38]
deps =
    pytest
    coverage == 7.3.0
    pytest-cov == 4.1.0
    requests == 2.22.0
    opencv_python == 4.8.1.78
    distro == 1.4.0
    PyYAML == 5.3.1

[testenv:py310]
deps =
    pytest
    coverage == 7.3.0
    pytest-cov == 4.1.0
    requests == 2.25.1
    opencv_python == 4.8.1.78
    numpy == 1.26.4
    distro == 1.7.0
    PyYAML == 6.0.1

[testenv:py312]
deps =
    pytest
    coverage == 7.4.4
    pytest-cov == 4.1.0
    requests == 2.31.0
    opencv_python == 4.8.1.78
    numpy == 1.26.4
    distro == 1.9.0
    PyYAML == 6.0.1

[testenv:py314]
deps =
    pytest == 9.0.2
    coverage == 7.13.5
    pytest-cov == 5.0.0
    requests == 2.32.5
    opencv_python == 4.10.0.84
    numpy == 2.3.5
    distro == 1.9.0
    PyYAML == 6.0.3

[pytest]
python_files = test_*.py
python_classes = !TestDmiMixin
norecursedirs =
    checkbox_support/vendor
