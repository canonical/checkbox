# launcher_template.ini — defaults for gen_launcher.py-generated launchers.
#
# Every section here (except [ui]'s "type", see below) is copied verbatim
# into every launcher gen_launcher.py writes, in the order given. Only
# [launcher], [test plan], [manifest] and [environment] are off-limits —
# those are always generated by gen_launcher.py itself from the selected
# plan and the values filled in the editor, so any such section here is
# silently ignored.
#
# This file is bundled next to gen_launcher.py and is read-only once
# packaged into a snap. To customize it, copy this file somewhere
# writable and pass it via --template PATH, or export
# CHECKBOX_LAUNCHER_TEMPLATE=/path/to/your-launcher_template.ini
# — either way the values below are just the shipped defaults.
#
# Uncomment/add any other launcher section your fleet needs, e.g.:
# [restart], [report:<name>], [transport:<name>], [exporter:<name>],
# [test selection], [agent]. See checkbox-ng's plainbox/impl/config.py
# for the full list of valid sections/keys.

[ui]
# gen_launcher.py always forces this to "interactive" when it writes a
# [test plan] filter (manual/automated/stress selection), regardless of
# what's set here, since the picker prompt requires it. For every other
# launcher this value is used as-is; "interactive" is the built-in
# default when this key is absent. Set to "silent" here for unattended
# runs instead.
type = interactive
