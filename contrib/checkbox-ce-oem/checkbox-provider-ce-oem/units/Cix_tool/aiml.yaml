id: cix-tool-aiml/benchmark
category_id: cix-tool-aiml
summary: Run noe_benchmark with the ONNX ResNet50 3-core model
purpose: |
  Verify that the NPU can run the 3-core ONNX ResNet50 model end to end with noe_benchmark from cix-ai-test:
  initialize the context, load the graph, create the job, run 1000 inference frames, then clean up and unload.
  This is the smoke test (TC-01) required in CIXEE-186.
  Every frame output is compared with the golden output.bin.
  The job passes when all 1000 frames print 'Test Result Check PASS', no [Err] line is printed and the exit code is 0.
plugin: shell
flags:
  - also-after-suspend
user: root
estimated_duration: 120.0
environ:
  - CIX_NOE_LIB_DIR
imports:
  - from com.canonical.plainbox import manifest
requires:
  - manifest.is_Cix_tool == 'True'
  - manifest.has_cix_ai_test_npu == 'True'
command: cix_ai_test.py benchmark --testdata /usr/share/cix/testdata/npu/onnx_resnet50_3core
