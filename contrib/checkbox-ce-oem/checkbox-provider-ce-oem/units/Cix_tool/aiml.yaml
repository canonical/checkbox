id: cix-tool-aiml/dfs
category_id: cix-tool-aiml
summary: Run noe_dfs to check NPU frequency scaling
purpose: |
  Verify that the NPU frequency can be changed through devfreq while inferences are running, using noe_dfs.
  noe_dfs writes /sys/class/devfreq/CIXH4000:00/userspace/set_freq, which exists only with the 'userspace' governor, so the test needs root.
  The script switches the governor to 'userspace' before the run and always restores the original governor afterwards.
  The job passes when the tool exits with 0, prints no [Err] or FAIL line and the expected completion lines are present. At least one 'Test Result Check PASS' is required.
plugin: shell
flags:
  - also-after-suspend
user: root
estimated_duration: 120.0
environ:
  - CIX_NOE_LIB_DIR
imports:
  - from com.canonical.plainbox import manifest
requires:
  - manifest.is_Cix_tool == 'True'
  - manifest.has_cix_ai_test_npu == 'True'
command: cix_ai_test.py dfs
