unit: job
id: iiotg_tgpio_driver_info
plugin: resource
summary: Report which TGPIO drivers are bound to TGPIO devices
purpose: |
  Report whether the out-of-tree ptp-intel-pmc-tgpio driver and the
  upstream pps_gen_tio driver are bound to at least one TGPIO ACPI
  device (INTC1021-INTC1024). This works for both loadable and
  built-in drivers.
command: |
  if ls /sys/bus/platform/drivers/intel-pmc-tgpio/INTC102* > /dev/null 2>&1; then
      echo "ptp_intel_pmc_tgpio: True"
  else
      echo "ptp_intel_pmc_tgpio: False"
  fi
  if ls /sys/bus/platform/drivers/intel-pps-gen-tio/INTC102* > /dev/null 2>&1; then
      echo "pps_gen_tio: True"
  else
      echo "pps_gen_tio: False"
  fi
estimated_duration: 1s
flags:
  - preserve-locale
---
unit: job
id: iiotg-tgpio/ptp-device-node-info
plugin: resource
summary: Get the PTP device node
purpose: Get the PTP device node, TGPIO will be used such as /devices/virtual/ptp/ptp*.
user: root
imports:
  - from com.canonical.contrib import iiotg_tgpio_driver_info
requires:
  - iiotg_tgpio_driver_info.ptp_intel_pmc_tgpio == 'True'
command: resource_wrapper.sh -- resource_tgpio_ptp_device_node_info.sh
estimated_duration: 1s
flags:
  - preserve-locale
---
unit: job
id: iiotg-tgpio/check-ptp-device-node-info-resource
plugin: shell
summary: Check TGPIO PTP device node resource generation
purpose: Verify PTP device node resource generation command executes directly.
user: root
depends:
  - iiotg-tgpio/driver-available
imports:
  - from com.canonical.plainbox import manifest
  - from com.canonical.contrib import iiotg_tgpio_driver_info
requires:
  - manifest.is_iiotg == 'True'
  - manifest.has_iiotg_tgpio == 'True'
  - iiotg_tgpio_driver_info.ptp_intel_pmc_tgpio == 'True'
command: resource_tgpio_ptp_device_node_info.sh
estimated_duration: 1s
flags:
  - preserve-locale
