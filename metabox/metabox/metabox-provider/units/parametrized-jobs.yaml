unit: parametrized-job
template-id: parametrized_1
parameters:
  - value: A
  - value: B
id: parametrized_1_{value}
flags: [simple]
command: 'true'
---
unit: test plan
id: parametrized_single
name: parametrized_single
# Instantiates parametrized_1_A and parametrized_1_B.
include:
  - parametrized_1_.*
---
unit: parametrized-job
template-id: parametrized_2
parameters:
  - value: A
    number: 1
  - value: B
    number: 2
id: parametrized_2_{value}_{number}
flags: [simple]
command: 'true'
---
unit: test plan
id: parametrized_multiple
name: parametrized_multiple
# Instantiates parametrized_2_A_1 and parametrized_2_B_2.
include:
  - parametrized_2_.*
---
id: parametrized_3_A
flags: [simple]
command: 'true'
---
unit: parametrized-job
template-id: parametrized_3
parameters:
  - value: B
    depends: parametrized_3_A
  - value: C
    depends: parametrized_3_B
id: parametrized_3_{value}
flags: [simple]
depends: ["{depends}"]
command: 'true'
---
id: parametrized_3_D
flags: [simple]
depends: [parametrized_3_C]
command: 'true'
---
unit: test plan
id: parametrized_depends
name: parametrized_depends
# Instantiates B and C; A and D are ordinary jobs.
# Expected order: parametrized_3_A -> B -> C -> D, despite reversed inclusion.
include:
  - parametrized_3_D
  - parametrized_3_C
  - parametrized_3_B
  - parametrized_3_A
---
unit: parametrized-job
template-id: parametrized_4
parameters:
  - value: A
id: parametrized_4_{value}
flags: [simple]
before: [suspend/suspend_advanced_auto]
command: 'true'
siblings:
  - id: after-suspend-parametrized_4_{value}
    depends:
      - parametrized_4_{value}
      - suspend/suspend_advanced_auto
    before: []
---
unit: test plan
id: parametrized_suspend
name: parametrized_suspend
# Expected order: parametrized_4_A -> existing suspend mock -> sibling.
# The sibling clears the inherited "before" to run after the mock.
include:
  - after-suspend-parametrized_4_A
  - suspend/suspend_advanced_auto
  - parametrized_4_A
