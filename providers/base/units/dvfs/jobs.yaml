id: dvfs/detect_dvfs_gpu_devices
category_id: dvfs
summary: Ensure any DVFS GPU devices are available for detection.
purpose: |
  Test to detect if any DVFS GPU device is available under /sys/class/devfreq by default.
  User can set the DVFS_GPU_DEVICES environment variable to specify the particular sysfs path for DVFS GPU devices.
  If no DVFS GPU device is available, the test will fail.
  If DVFS GPU devices are available, the test will pass.
  If DVFS_GPU_DEVICES environment variable is set, the test will check if the expected devices and their governors are matched against the
  actual available DVFS GPU devices.
  Example:
    Single and simple dvfs gpu device:
      DVFS_GPU_DEVICES="13000000.gpu"
    Single and simple dvfs gpu device with specific sysfs path:
      DVFS_GPU_DEVICES="/sys/class/misc/mali0/device/devfreq/13000000.gpu13000000.gpu"
    Single dvfs gpu device with governors:
      DVFS_GPU_DEVICES="13000000.gpu|userspace,powersave,performance,simple_ondemand"
    Multiple dvfs gpu device with governors:
      DVFS_GPU_DEVICES="13000000.gpu|userspace,powersave,performance,simple_ondemand soc:99000000.gpu|userspace,powersave"
plugin: shell
user: root
flags:
  - also-after-suspend
estimated_duration: 1
environ:
  - DVFS_GPU_DEVICES
command: dvfs_gpu_test.py detect
---
id: dvfs/dvfs_gpu_resource
category_id: dvfs
summary: Generate resource records for DVFS devices
purpose: |
  Generate resource records for DVFS GPU device available under
  /sys/class/devfreq path
plugin: resource
user: root
estimated_duration: 1
environ:
  - DVFS_GPU_DEVICES
command: dvfs_gpu_test.py resource
---
unit: template
template-engine: jinja2
template-resource: dvfs/dvfs_gpu_resource
template-unit: job
template-id: dvfs/dvfs_gpu_device_governor_test
id: dvfs/dvfs_gpu_{{dvfs_device_name}}-{{governor}}
category_id: dvfs
summary: Validate DVFS GPU '{{dvfs_device_name}}' device with '{{governor}}' governor
purpose: |
  Test the DVFS GPU '{{dvfs_device_name}}' device with '{{governor}}' governor
  by adjusting the governor's frequency accordingly.
plugin: shell
user: root
depends:
  - dvfs/detect_dvfs_gpu_devices
estimated_duration: 5s
flags:
  - also-after-suspend
command: dvfs_gpu_test.py test -d "{{dvfs_device_name}}" -g "{{governor}}"
