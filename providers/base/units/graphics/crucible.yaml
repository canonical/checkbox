unit: setup job
plugin: shell
id: setup/install_crucible
category_id: com.canonical.plainbox::graphics
summary: Install crucible snap
purpose: This job will install the crucible snap, a dependency of crucible graphics testing
user: root
command: |
  if snap list crucible &>/dev/null; then
    snap refresh --edge crucible
  else
    snap install --edge crucible
  fi
estimated_duration: 1m
---
plugin: resource
id: graphics/vk_crucible_gpu_avail
category_id: com.canonical.plainbox::graphics
user: root
summary: Checks for Vulkan-capable GPU
environ:
  - XDG_SESSION_TYPE
  - XDG_RUNTIME_DIR
estimated_duration: 1s
command: |
  if env -u DISPLAY crucible.vulkaninfo --summary 2>&1 | grep "PHYSICAL_DEVICE_TYPE_.*_GPU"; then
    echo "PASS: Found a Vulkan-capable GPU"
  else
    echo "FAIL: No Vulkan-capable GPU found"
    exit 1
  fi
---
id: graphics/crucible_core_stencil_triangles
depends:
  - graphics/vk_crucible_gpu_avail
setup_include:
  - setup/install_crucible
category_id: com.canonical.plainbox::graphics
