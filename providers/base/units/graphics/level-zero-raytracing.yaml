unit: job
plugin: shell
id: setup/install_level_zero_raytracing
category_id: com.canonical.plainbox::graphics
summary: Install level-zero-raytracing-tests snap
purpose: This job will install the level-zero-raytracing-tests snap, a dependency of Level Zero raytracing conformance testing
user: root
command: |
  if snap list level-zero-raytracing-tests &>/dev/null; then
    snap refresh --beta level-zero-raytracing-tests
  else
    snap install --beta level-zero-raytracing-tests
  fi
estimated_duration: 1m
---
unit: job
plugin: shell
id: graphics/lzrt_gpu_avail
depends:
  - setup/install_level_zero_raytracing
category_id: com.canonical.plainbox::graphics
user: root
summary: Checks for GPU for level-zero-raytracing-tests
estimated_duration: 1s
command: |
  if level-zero-raytracing-tests.check-gpu; then
    echo "PASS: Found a Level Zero GPU"
  else
    echo "FAIL: No Level Zero GPU found"
    exit 1
  fi
---
