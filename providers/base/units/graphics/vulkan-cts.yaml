unit: setup job
plugin: shell
id: setup/install_vulkan_cts
category_id: com.canonical.plainbox::graphics
summary: Install vulkan-cts snap
user: root
command: |
  if snap list vulkan-cts &>/dev/null; then
    snap refresh --beta vulkan-cts
  else
    snap install --beta vulkan-cts
  fi
estimated_duration: 1m
---
plugin: resource
id: graphics/vk_gpu_avail
category_id: com.canonical.plainbox::graphics
user: root
summary: Checks for Vulkan-capable GPU
environ:
  - XDG_SESSION_TYPE
  - XDG_RUNTIME_DIR
estimated_duration: 1s
command: |
  # Unset DISPLAY so vulkaninfo skips surface/window-system checks and runs
  # in headless mode
  if env -u DISPLAY vulkan-cts.vulkaninfo --summary 2>&1 | grep "PHYSICAL_DEVICE_TYPE_.*_GPU"; then
    echo "PASS: Found a Vulkan-capable GPU"
  else
    echo "FAIL: No Vulkan-capable GPU found"
    exit 1
  fi
---
