unit: job
plugin: shell
id: graphics/vk_classic_gpu_avail
category_id: com.canonical.plainbox::graphics
user: root
requires:
  - executable.name == 'vulkaninfo'
summary: Checks for Vulkan-capable GPU using host drivers
environ:
  - XDG_SESSION_TYPE
  - XDG_RUNTIME_DIR
  - PATH
estimated_duration: 1s
command: vk_host.py resource
---
unit: job
plugin: shell
id: graphics/vk_classic_vk_avail
category_id: com.canonical.plainbox::graphics
user: root
summary: Checks for host Vulkan ICD loader required by vulkan-cts --no-confinement
estimated_duration: 1s
command: vk_host.py validate-install
---
id: graphics/vk_classic_api
depends:
  - graphics/vk_classic_gpu_avail
  - graphics/vk_classic_vk_avail
category_id: com.canonical.plainbox::graphics
flags:
  - simple
user: root
summary: Run the api tests from Vulkan-CTS (classic)
environ:
  - XDG_SESSION_TYPE
  - XDG_RUNTIME_DIR
estimated_duration: 30m
command: |
  # mustpass/main/vk-default/api.txt is contained in the vulkan-cts snap
  # All options can be found in vulkan-cts.list-tests
  # vk_host.py used to wrap extra env vars, paths, and flags vs Core tests
  vk_host.py run-test --caselist=mustpass/main/vk-default/api.txt
siblings:
  - id: graphics/vk_classic_binding_model
    summary: Run the binding-model tests from Vulkan-CTS (classic)
    command: vk_host.py run-test --caselist=mustpass/main/vk-default/binding-model.txt
  - id: graphics/vk_classic_clipping
    summary: Run the clipping tests from Vulkan-CTS (classic)
    command: vk_host.py run-test --caselist=mustpass/main/vk-default/clipping.txt
  - id: graphics/vk_classic_compute
    summary: Run the compute tests from Vulkan-CTS (classic)
    command: vk_host.py run-test --caselist=mustpass/main/vk-default/compute.txt
  - id: graphics/vk_classic_conditional_rendering
    summary: Run the conditional-rendering tests from Vulkan-CTS (classic)
    command: vk_host.py run-test --caselist=mustpass/main/vk-default/conditional-rendering.txt
  - id: graphics/vk_classic_cooperative_vector
    summary: Run the cooperative-vector tests from Vulkan-CTS (classic)
    command: vk_host.py run-test --caselist=mustpass/main/vk-default/cooperative-vector.txt
