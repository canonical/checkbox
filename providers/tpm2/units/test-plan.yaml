unit: test plan
id: clevis-automated
name: TPM 2.0 (Trusted Platform Module) Clevis encryption tests
description: Clevis encryption tests
estimated_duration: 1m
mandatory_include:
  - com.canonical.plainbox::manifest
bootstrap_include:
  - tpm2_pcr_banks
include:
  - tpm2/detect:
      certification-status: blocker
  - clevis-encrypt-tpm2/precheck:
      certification-status: blocker
  - clevis-encrypt-tpm2/detect-rsa-capabilities-pcr-bank:
      certification-status: blocker
  - clevis-encrypt-tpm2/rsa_pcr_bank:
      certification-status: blocker
  - clevis-encrypt-tpm2/detect-ecc-capabilities-pcr-bank:
      certification-status: blocker
  - clevis-encrypt-tpm2/ecc_pcr_bank:
      certification-status: blocker
---
unit: test plan
id: tpm-cert-full
name: TPM tests
description: |
  TPM tests that should be run as part of Certification. This could be a
  collection of tests using a variety of tools
include: []
nested_part:
  - tpm-cert-manual
  - tpm-cert-automated
---
unit: test plan
id: tpm-cert-manual
name: TPM tests (Manual)
description: |
  TPM tests that should be run as part of Certification. This could be a
  collection of tests using a variety of tools
include: []
---
unit: test plan
id: tpm-cert-automated
name: TPM tests (Automated)
description: |
  TPM tests that should be run as part of Certification. This could be a
  collection of tests using a variety of tools
include:
  - tpm2/fwts-event-log-dump
nested_part:
  - clevis-automated
---
