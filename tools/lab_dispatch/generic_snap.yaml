job_queue: $INPUT_QUEUE
global_timeout: 18000
output_timeout: 1800
$INPUT_DATA_SOURCE
test_data:
  attachments:
    - local: "patched-checkbox.snap"
      agent: "patched-checkbox.snap"
    - local: "resources/manifest.conf"
      agent: "manifest.conf"
    - local: "resources/checkbox.no-manifest.partial.conf"
      agent: "checkbox.no-manifest.partial.conf"
    - local: "launcher_override.conf"
      agent: "launcher_override.conf"
  test_cmds: |
    #!/usr/bin/env bash

    set -x
    set -e

    CHECKBOX_REVISION="$INPUT_CHECKBOX_REVISION"
    SERIES="$INPUT_CHECKBOX_SERIES"
    RESOURCES_PATH="attachments/test"

    curl -Ls -o install_tools.sh \
        https://raw.githubusercontent.com/canonical/certification-lab-ci-tools/main/install_tools.sh
    source install_tools.sh tools --branch main

    wait_for_ssh --allow-degraded
    _run sudo snap wait system seed.loaded

    _run clean_machine --im-sure

    CHECKBOX="checkbox$SERIES"
    if _run snap list "$CHECKBOX"; then
        _run sudo snap remove "$CHECKBOX"
    fi
    _put "$RESOURCES_PATH/patched-checkbox.snap" :
    _run sudo snap install --dangerous --devmode ./patched-checkbox.snap
    _run sudo snap start --enable "$CHECKBOX.agent"

    git_get_shallow https://github.com/canonical/checkbox.git \
        commit "$CHECKBOX_REVISION"
    pipx install checkbox/checkbox-ng

    MANIFEST_FILE=manifest.conf
    set +e
    fetch_manifest --manifest_file manifest.conf \
        $CID $HEXR_DEVICE_SECURE_ID
    if [ $? -ne 0 ]; then
        echo "Using default manifest"
        MANIFEST_FILE=$RESOURCES_PATH/manifest.conf
    fi
    set -e

    which envsubst || install_packages gettext
    envsubst < $RESOURCES_PATH/checkbox.no-manifest.partial.conf \
        > checkbox.no-manifest.conf
    stacker --output checkbox.conf checkbox.no-manifest.conf \
        $MANIFEST_FILE $RESOURCES_PATH/launcher_override.conf

    _run sudo reboot
    wait_for_ssh --allow-degraded
    _run sudo snap start --enable "$CHECKBOX.agent"

    set +e
    PYTHONUNBUFFERED=1 checkbox-cli control "$DEVICE_IP" checkbox.conf
    EXITCODE=$?
    set -e

    collect_artifacts --include checkbox.conf
    SUBMISSION=$(find "${XDG_DATA_HOME:-$HOME/.local/share}/checkbox-ng" \
        -maxdepth 1 -type f -name 'submission_*.json' \
        -newer checkbox.conf -print -quit)
    if [ -z "$SUBMISSION" ]; then
        echo "Checkbox did not produce a submission JSON report" >&2
        exit 1
    fi
    cp "$SUBMISSION" artifacts/submission.json

    exit "$EXITCODE"
